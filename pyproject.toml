[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotframework-robotlibrary"
dynamic = ["version"]
description = "Robot Framework library for testing Robot Framework tests and tasks within Robot Framework itself."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "robotframework-robotlibrary contributors" },
]
keywords = [
    "robotframework",
    "testing",
    "testautomation",
    "meta-testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "robotframework>=5.0",
]

[project.urls]
Homepage = "https://github.com/datakurre/robotframework-robotlibrary"
Repository = "https://github.com/datakurre/robotframework-robotlibrary"
Issues = "https://github.com/datakurre/robotframework-robotlibrary/issues"

[tool.hatch.version]
path = "src/RobotLibrary/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/RobotLibrary"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
]
